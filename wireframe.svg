    <text x="220" y="556" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700">CONTACT ME (H2)</text>
    <text x="220" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="13">Contact introduction</text>
