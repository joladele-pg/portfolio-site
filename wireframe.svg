  <!-- Design notes -->
  <rect x="40" y="875" width="1420" height="130" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="70" y="912" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">DESIGN NOTES</text>
  <text x="70" y="948" font-family="Arial, sans-serif" font-size="16" fill="#0f172a">Color palette:</text>
  <rect x="190" y="930" width="28" height="28" fill="#0f172a"/><text x="228" y="950" font-family="Arial, sans-serif" font-size="14">Navy #0F172A</text>
  <rect x="370" y="930" width="28" height="28" fill="#2563eb"/><text x="408" y="950" font-family="Arial, sans-serif" font-size="14">Blue #2563EB</text>
  <rect x="550" y="930" width="28" height="28" fill="#f8fafc" stroke="#94a3b8"/><text x="588" y="950" font-family="Arial, sans-serif" font-size="14">Off-white #F8FAFC</text>
  <rect x="770" y="930" width="28" height="28" fill="#334155"/><text x="808" y="950" font-family="Arial, sans-serif" font-size="14">Slate #334155</text>
  <text x="70" y="982" font-family="Arial, sans-serif" font-size="16" fill="#0f172a">Fonts: Poppins for headings; Arial as fallback. Open Sans for body text; Arial/sans-serif as fallback.</text>
</svg>
