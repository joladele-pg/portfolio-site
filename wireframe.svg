    <rect x="40" y="390" width="170" height="135" fill="#f1f5f9" stroke="#64748b"/>
    <rect x="230" y="390" width="170" height="135" fill="#f1f5f9" stroke="#64748b"/>
    <text x="125" y="448" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">Project Card</text>
    <text x="315" y="448" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">Project Card</text>
    <text x="125" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">H3 + summary</text>
    <text x="315" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">H3 + summary</text>
