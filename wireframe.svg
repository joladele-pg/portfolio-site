    <text x="220" y="373" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Short biography</text>
    <text x="220" y="436" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">Skills and Interests (H3)</text>
    <text x="220" y="459" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Skills summary</text>
