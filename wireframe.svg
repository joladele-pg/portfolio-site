    <text x="220" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Description + skills</text>
    <text x="220" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">Project Two (H3)</text>
    <text x="220" y="469" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Description + skills</text>
    <text x="220" y="539" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">Project Three (H3)</text>
    <text x="220" y="563" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Description + skills</text>
    <rect x="20" y="628" width="400" height="42" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
    <text x="220" y="655" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">WORK IN PROGRESS (H2)</text>
